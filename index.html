// Beep de selección
function playSelectBeep(){ 
  try{ 
    if(!window.audioCtx) window.audioCtx=new (window.AudioContext||window.webkitAudioContext)(); 
    const o=window.audioCtx.createOscillator(); 
    const g=window.audioCtx.createGain(); 
    o.type='square'; 
    o.frequency.setValueAtTime(700,window.audioCtx.currentTime); 
    g.gain.setValueAtTime(0.15,window.audioCtx.currentTime); 
    o.connect(g).connect(window.audioCtx.destination); 
    o.start(); 
    o.stop(window.audioCtx.currentTime+0.08);
  }catch(e){} 
}

// Renderizado del contenido con formato
function renderContent(section) {
  const data = content[section] || [];
  let html = "";
  if (data.length > 0) {
    html += `<h3>${data[0]}</h3>`;
    if (data.length > 1) {
      html += "<ul>";
      for (let i = 1; i < data.length; i++) {
        html += `<li>${data[i].replace("• ", "")}</li>`;
      }
      html += "</ul>";
    }
  }
  return html;
}

const menuDiv=document.getElementById('menu');
const menuBox=document.getElementById('menu-box');
const contentBox=document.getElementById('content-box');
const contentDiv=document.getElementById('content');
const sectionTitle=document.getElementById('section-title');
const startScreen=document.getElementById('start-screen');
const startBtn=document.getElementById('start-btn');
const terminalText=document.getElementById('terminal-text');
const menuInstructionsDiv=document.getElementById('menu-instructions');
let selectedIndex=0;

// Render menú
function renderMenu(){ 
  menuDiv.innerHTML=''; 
  options.forEach((opt,i)=>{
    const d=document.createElement('div'); 
    d.textContent=`${i+1}. ${opt.replace('_',' ')}`; 
    d.className='menu-item'+(i===selectedIndex?' selected':''); 
    d.onclick=()=>{ selectedIndex=i; openContent(); }; 
    menuDiv.appendChild(d); 
  });
}

// Abrir contenido
function openContent(){ 
  playSelectBeep(); 
  menuBox.style.display='none'; 
  contentBox.style.display='block'; 
  const current = options[selectedIndex];
  sectionTitle.textContent = current.replace('_',' ');
  contentDiv.innerHTML = renderContent(current);
}

// Manejo de teclas
function handleKey(e){
  if(contentBox.style.display==='block' && e.key==='Escape'){ 
    contentBox.style.display='none'; 
    menuBox.style.display='flex'; 
    renderMenu(); 
  } else if(menuBox.style.display==='flex'){
    if(e.key==='ArrowDown'){ selectedIndex=(selectedIndex+1)%options.length; renderMenu(); e.preventDefault(); }
    else if(e.key==='ArrowUp'){ selectedIndex=(selectedIndex-1+options.length)%options.length; renderMenu(); e.preventDefault(); }
    else if(e.key==='Enter'){ openContent(); }
  }
}

// Intro typing lines
const introLines = [

let lineIndex=0;

function typeIntroLine(){
  if(lineIndex<introLines.length){
    const line=introLines[lineIndex];
    let charIndex=0;
    const lineInterval=setInterval(()=>{
      if(charIndex<line.length){
        terminalText.textContent+=line[charIndex++];
        playSelectBeep();
      }else{
        terminalText.textContent+='\n';
        clearInterval(lineInterval);
        lineIndex++;
        setTimeout(typeIntroLine, 200);
      }
    },40);
  } else {
    document.querySelector('.cursor').style.display='none';
    startBtn.style.opacity=1;
    startBtn.style.pointerEvents='all';
  }
}

// Iniciar
typeIntroLine();

startBtn.addEventListener('click', ()=>{
  startScreen.remove();
  menuBox.style.display='flex';
  const menuInstructionsText = "navigate: ↑ ↓       select: ENTER      salir: ESC";
  function typeMenuInstructions(callback){
    menuInstructionsDiv.textContent='';
    let i=0;
    const interval=setInterval(()=>{
      if(i<menuInstructionsText.length){
        menuInstructionsDiv.textContent+=menuInstructionsText[i++];
      } else {
        clearInterval(interval);
        if(callback) callback();
      }
    },20);
  }
  typeMenuInstructions(()=>renderMenu());
  window.focus();
  document.body.focus();
  document.addEventListener('keydown', handleKey);
});
